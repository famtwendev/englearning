services:
  # ============================================================
  # Infrastructure Services
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: eng_learning_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sysadmin@123
      POSTGRES_DB: eng_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eng_network

  redis:
    image: redis:7-alpine
    container_name: eng_learning_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eng_network

  minio:
    image: minio/minio
    container_name: eng_learning_minio
    environment:
      MINIO_ROOT_USER: sysadmin
      MINIO_ROOT_PASSWORD: sysadmin@123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - eng_network

  # ============================================================
  # Backend Services
  # Build context: ./backend/ (cần parent pom.xml)
  # ============================================================
  identity-service:
    build:
      context: ./backend
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eng_learning_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: sysadmin@123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eng_network

  core-learning-service:
    build:
      context: ./backend
      dockerfile: core-learning-service/Dockerfile
    container_name: core-learning-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eng_learning_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: sysadmin@123
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION: 86400000
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eng_network

  assessment-service:
    build:
      context: ./backend
      dockerfile: assessment-service/Dockerfile
    container_name: assessment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eng_learning_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: sysadmin@123
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - eng_network

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      # Override routes trong application.yml: localhost → tên service Docker
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: identity-service
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://identity-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/v1/auth/**
      SPRING_CLOUD_GATEWAY_ROUTES_1_ID: identity-service-openapi
      SPRING_CLOUD_GATEWAY_ROUTES_1_URI: http://identity-service:8081
      SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: Path=/v3/api-docs/identity-service
      SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0: RewritePath=/v3/api-docs/identity-service, /v3/api-docs
      SPRING_CLOUD_GATEWAY_ROUTES_2_ID: core-learning-service
      SPRING_CLOUD_GATEWAY_ROUTES_2_URI: http://core-learning-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: Path=/api/v1/topics/**,/api/v1/progress/**,/api/v1/ipa/**
      SPRING_CLOUD_GATEWAY_ROUTES_3_ID: core-learning-service-openapi
      SPRING_CLOUD_GATEWAY_ROUTES_3_URI: http://core-learning-service:8082
      SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: Path=/v3/api-docs/core-learning-service
      SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: RewritePath=/v3/api-docs/core-learning-service, /v3/api-docs
      # CORS: frontend trong Docker phát từ port 80
      SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS: "http://localhost,http://localhost:5173"
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - core-learning-service
      - assessment-service
    restart: unless-stopped
    networks:
      - eng_network

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - eng_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  eng_network:
    driver: bridge
