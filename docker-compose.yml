services:
  postgres:
    image: postgres:15-alpine
    container_name: eng_learning_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: syadmin@123
      POSTGRES_DB: eng_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eng_learning_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
